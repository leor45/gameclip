<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- media-src/img-src permiten gameclip-media:, el protocolo de clips y miniaturas
         servido por el main; sin eso el reproductor y la biblioteca quedan bloqueados. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:3030 ws://localhost:5173; media-src 'self' gameclip-media:; img-src 'self' data: gameclip-media:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameClip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
